<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>zenit · Web DOM host</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; font-family: system-ui, sans-serif; }
  #app { position: absolute; inset: 0 0 28px 0; }
  #stats { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; line-height: 28px; padding: 0 12px;
           font: 12px ui-monospace, Menlo, monospace; color: #555; background: #e9ebef; }
</style>
</head>
<body>
<div id="app"></div>
<div id="stats">loading wasm…</div>
<script type="module">
  import { startZenit } from '../runtime/zenit-dom.mjs';
  const stats = document.getElementById('stats');
  const dark = new URLSearchParams(location.search).has('dark');
  window.__zenit = await startZenit({
    wasm: './web-dom-demo.wasm',
    container: document.getElementById('app'),
    dark,
    renderer: new URLSearchParams(location.search).get('renderer') || 'webgpu',
    stats: (p) => { stats.textContent = `DOM nodes ${p.nodes()} · frame ${p.lastFrameMs.toFixed(2)} ms · cmds ${p.lastCmds} words · frames ${p.frames}`; },
  });
</script>
</body>
</html>
